<!--
  v.328 update (2026-05-13): the connector retired the standalone "Module Discovery"
  card and split it into two: "Formatted UX Pages" (apps → pages → grid widgets)
  and "AI Analyst" (NL queries against the model). This demo is now the UX Pages
  walkthrough. The NL-query flow lives in demo/llm-agent.html.

  Audio files: discovery-1..5.mp3 still serve, but their narration script
  references the old Module Discovery flow. Re-record before relaunching audio.
  In the meantime the demo defaults to muted (no audio file requests on first
  play) and the visual animation tells the new story on its own.
-->

<script>
const SCENES=[
  {name:'Open Formatted UX Pages',duration:5000},
  {name:'Browse UX Apps',duration:6000},
  {name:'Drill Into Pages',duration:7000},
  {name:'Pick a Grid Widget',duration:7000},
  {name:'Formatted Output in Sheets',duration:9000},
];
const TOTAL=SCENES.reduce((s,sc)=>s+sc.duration,0);
let playing=true,currentScene=0,sceneTimer=null,sceneStart=0,elapsed=0,animFrameId=null;

function togglePlay(){playing=!playing;document.getElementById('playBtn').textContent=playing?'⏸ Pause':'▶ Play';if(playing)runScene(currentScene)}
function restartDemo(){
  playing=true;document.getElementById('playBtn').textContent='⏸ Pause';
  currentScene=0;elapsed=0;clearTimeout(sceneTimer);cancelAnimationFrame(animFrameId);
  document.getElementById('discOverlay').classList.remove('visible');
  updateProgress();runScene(0);
}
function updateProgress(){
  document.getElementById('globalProgress').style.width=Math.min((elapsed/TOTAL)*100,100)+'%';
  document.getElementById('stepNum').textContent=currentScene+1;
  document.getElementById('stepLabel').textContent=SCENES[currentScene]?.name||'Complete';
}
function runScene(idx){
  if(idx>=SCENES.length){
    currentScene=SCENES.length-1;updateProgress();
    if(new URLSearchParams(location.search).has('loop')){setTimeout(()=>restartDemo(),2000)}
    return
  }
  currentScene=idx;sceneStart=Date.now();updateProgress();playNarration(idx);
  [scene1,scene2,scene3,scene4,scene5][idx]();
  sceneTimer=setTimeout(()=>{elapsed+=SCENES[idx].duration;if(playing)runScene(idx+1)},SCENES[idx].duration);
  const tick=()=>{if(!playing)return;const se=Date.now()-sceneStart;document.getElementById('globalProgress').style.width=Math.min(((elapsed+se)/TOTAL)*100,100)+'%';if(se<SCENES[idx].duration)animFrameId=requestAnimationFrame(tick)};
  animFrameId=requestAnimationFrame(tick);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function initGrid(){
  const t=document.getElementById('gridTable');const L='ABCDEFGHIJ'.split('');
  let h='<thead><tr><th class="corner"></th>';L.forEach(l=>{h+=`<th class="col-header">${l}</th>`});
  h+='</tr></thead><tbody>';for(let r=1;r<=25;r++){h+=`<tr><td class="row-header">${r}</td>`;L.forEach(()=>{h+='<td></td>'});h+='</tr>'}h+='</tbody>';t.innerHTML=h;
}

function typeText(el,text,speed=50){
  return new Promise(resolve=>{let i=0;el.classList.add('type-cursor');
  const iv=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(iv);el.classList.remove('type-cursor');resolve()}},speed)});
}

// Scene 1: Sidebar shows the "Formatted UX Pages" card (v.328 nav-card layout)
async function scene1(){
  initGrid();
  const sb=document.getElementById('sidebarContent');
  sb.innerHTML=`
    <div style="background:var(--ios-surface);padding:16px;border-radius:12px;border:1px solid var(--ios-border);text-align:center">
      <div style="font-size:32px;margin-bottom:8px">📑</div>
      <div style="font-size:16px;font-weight:600;color:var(--ios-text-primary);margin-bottom:4px">Formatted UX Pages</div>
      <div style="font-size:12px;color:var(--ios-text-secondary);margin-bottom:16px">Browse the apps, categories, and pages in your active model's Anaplan UX. Export grid-page widgets to Sheets with their formatted layout intact.</div>
      <div style="background:#f0fdf4;border-radius:8px;padding:8px;margin-bottom:12px;font-size:11px;color:#059669;font-weight:500">
        Model: Revenue & Headcount<br>FY26 Planning • Acme Corp
      </div>
      <button class="btn-primary" id="exploreBtn" style="background:linear-gradient(135deg,#00C7BE,#0891B2)">📑 Browse UX Pages</button>
    </div>
  `;
  await wait(2000);
  document.getElementById('exploreBtn').style.boxShadow='0 4px 20px rgba(0,199,190,0.4)';
}

// Scene 2: Click Browse → dialog opens → loads UX board definition

  const cols=['Line Item','QTD Actuals','QTD Forecast','QTD Variance','QTD Var %','QTD YoY','YTD Actuals','YTD Budget','YTD Variance','Comment'];
  const rows=[
    ['Salaries',{n:946785,t:'pos'},{n:990000,t:'pos'},{n:43215,t:'pos'},{n:'4.6%'},{n:'+8.1%'},{n:3782940},{n:3960000},{n:177060,t:'pos'},'On track — Q3 hires deferred'],
    ['Bonus',{n:159933,t:'pos'},{n:172000,t:'pos'},{n:12067,t:'pos'},{n:'7.5%'},{n:'+12.3%'},{n:639732},{n:688000},{n:48268,t:'pos'},''],
    ['SBC',{n:379426,t:'pos'},{n:380000,t:'pos'},{n:574,t:'pos'},{n:'0.2%'},{n:'+5.0%'},{n:1517704},{n:1520000},{n:2296,t:'pos'},''],
    ['Headcount Expense Total',{n:1486144,t:'pos'},{n:1542000,t:'pos'},{n:55856,t:'pos'},{n:'3.8%'},{n:'+7.8%'},{n:5940376},{n:6168000},{n:227624,t:'pos'},'',true],
    ['Travel',{n:82400,t:'pos'},{n:75000,t:'pos'},{n:-7400,t:'neg'},{n:'-9.0%'},{n:'+22%'},{n:329600},{n:300000},{n:-29600,t:'neg'},'Conference spend ahead'],
    ['Marketing',{n:218500,t:'pos'},{n:200000,t:'pos'},{n:-18500,t:'neg'},{n:'-8.5%'},{n:'+15%'},{n:874000},{n:800000},{n:-74000,t:'neg'},''],
    ['Software',{n:142800,t:'pos'},{n:155000,t:'pos'},{n:12200,t:'pos'},{n:'8.5%'},{n:'+3%'},{n:571200},{n:620000},{n:48800,t:'pos'},''],
    ['Controllable Total',{n:443700,t:'pos'},{n:430000,t:'pos'},{n:-13700,t:'neg'},{n:'-3.1%'},{n:'+12%'},{n:1774800},{n:1720000},{n:-54800,t:'neg'},'',true],
  ];
  let html='<thead><tr><th class="corner"></th>';
  cols.forEach((_,i)=>{const L='ABCDEFGHIJ'[i];html+=`<th class="col-header">${L}</th>`});
  html+='</tr><tr><th class="row-header">1</th>';
  cols.forEach(c=>{const isHC=c.startsWith('QTD');const isYTD=c.startsWith('YTD');const bg=isHC?'#1e40af':(isYTD?'#92400e':'#374151');html+=`<th style="font-size:10px;font-weight:600;padding:4px 6px;background:${bg};color:#fff;border-color:${bg}">${c}</th>`});
  html+='</tr></thead><tbody>';
  rows.forEach((r,i)=>{
    const isTotal=r[r.length-1]===true;
    const cls=isTotal?'total-row':'';
    const cellRows=isTotal?r.slice(0,-1):r;
    html+=`<tr><td class="row-header">${i+2}</td>`;
    cellRows.forEach((cell,ci)=>{
      if(typeof cell==='string'){
        const isComment=ci===cols.length-1;
        html+=`<td class="${cls}${isComment?' secondary':''}" style="font-weight:${isTotal?700:500};font-size:10px${isComment?';font-style:italic;color:#6B7280':''}">${cell}</td>`;
      } else {
        const negCls=cell.t==='neg'?' neg':'';
        const val=typeof cell.n==='number'?cell.n.toLocaleString():cell.n;
        const display=cell.t==='neg'?'('+val.replace('-','')+')':val;
        html+=`<td class="${cls} num${negCls}" style="font-weight:${isTotal?700:400}">${display}</td>`;
      }
    });
    html+='</tr>';
  });

  const tab=document.querySelector('.sheet-tab.active');
  if(tab) tab.textContent='Kyle Triplett';
  // Caption / footer in sidebar showing what just happened
  const sb=document.getElementById('sidebarContent');
  sb.innerHTML=`

    </div>
    <div style="font-size:11px;color:#6B7280;line-height:1.5">Header band, entity row colors, conditional formatting, and column widths come from the source UX widget — no manual styling required in Sheets.</div>
  `;
}

// === Audio Narration ===
let audioMuted = false;
const audioClips = [document.getElementById('audio-1'),document.getElementById('audio-2'),document.getElementById('audio-3'),document.getElementById('audio-4'),document.getElementById('audio-5')];
function toggleMute(){
  audioMuted = !audioMuted;
  document.getElementById('muteBtn').textContent = audioMuted ? '🔇' : '🔊';
  if(audioMuted) audioClips.forEach(a => { a.pause(); a.currentTime = 0; });
}
function playNarration(idx){
  if(audioMuted || idx < 0 || idx >= audioClips.length) return;
  audioClips.forEach(a => { a.pause(); a.currentTime = 0; });
  audioClips[idx].play().catch(()=>{});
}
