<script>
// Recognized quarterly revenue, not annualized ARR. Every subtotal and FY value
// is derived from these fictional leaf records; percentages are never summed.
const uxPnlSource={
  existing:[9825000,10582000,11030000,11570000],
  newSubscriptions:[1350000,1625000,1800000,1950000],
  expansion:[585000,723000,810000,900000],
  services:[1380000,1480000,1560000,1630000],
  hosting:[1314000,1441000,1520000,1605000],
  support:[1578000,1729000,1824000,1926000],
  onboarding:[1050000,1153000,1216000,1284000]
};
function buildUxFinancials(source=uxPnlSource){
  const add=(...arrays)=>arrays[0].map((_,index)=>arrays.reduce((sum,array)=>sum+array[index],0));
  const annual=quarters=>[...quarters,quarters.reduce((sum,value)=>sum+value,0)];
  const saas=add(source.existing,source.newSubscriptions,source.expansion),revenue=add(saas,source.services),cogs=add(source.hosting,source.support,source.onboarding);
  const grossProfit=revenue.map((value,index)=>value-cogs[index]);
  const result=Object.fromEntries(Object.entries({...source,saas,revenue,cogs,grossProfit}).map(([key,values])=>[key,annual(values)]));
  result.grossMargin=result.revenue.map((value,index)=>value===0?null:result.grossProfit[index]/value);
  return result;
}
window.UXFinancials={source:uxPnlSource,build:buildUxFinancials};
const SCENES=[
  {name:'Board Widgets',duration:7000},
  {name:'Select Widget',duration:6000},
  {name:'Widget Config',duration:7000},
  {name:'Execute & Write',duration:8000},
  {name:'Apply Formatting',duration:10000},
  {name:'Final Formatted P&L',duration:7000},
];
let demoPlayer, formattingRequested=true;

const wait=ms=>demoPlayer.wait(ms);
function resetDemo(){
  formattingRequested=true;
  setFormattingPath(true);
  initGrid();document.getElementById('sheetTabs').innerHTML='<div class="sheet-tab active">Sheet1</div>';
}

function initGrid(){
  const t=document.getElementById('gridTable');const L='ABCDEFGHIJ'.split('');
  let h='<thead><tr><th class="corner"></th>';L.forEach(l=>{h+=`<th class="col-header">${l}</th>`});
  h+='</tr></thead><tbody>';for(let r=1;r<=30;r++){h+=`<tr><td class="row-header">${r}</td>`;L.forEach(()=>{h+='<td></td>'});h+='</tr>'}h+='</tbody>';t.innerHTML=h;
}

// Scene 1: Discovery tab showing board with widgets
async function scene1(){
  initGrid();
  const sb=document.getElementById('sidebarContent');
  sb.innerHTML=`
    <div style="background:var(--ios-surface);padding:12px;border-radius:12px;border:1px solid var(--ios-border);margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:20px">🎨</span>
        <div>
          <div style="font-size:14px;font-weight:600">Formatted UX Pages</div>
          <div style="font-size:11px;color:var(--ios-text-secondary)">FY26 Executive Dashboard</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--ios-text-tertiary);margin-bottom:12px">Export a supported grid with its source formatting. Chart and KPI cards are shown for context only.</div>
      <div style="font-size:12px;font-weight:600;color:var(--ios-text-primary);margin-bottom:8px">Board Widgets:</div>
      <div id="widgetList"></div>
    </div>
  `;
  const widgets=[
    {name:'OUTPUT: P&L Statement',type:'Grid',icon:'📊'},
    {name:'OUTPUT: Revenue Waterfall',type:'Chart',icon:'📈'},
    {name:'OUTPUT: HC Summary',type:'Grid',icon:'👥'},
    {name:'OUTPUT: OpEx by Department',type:'Grid',icon:'💰'},
    {name:'KPI: Gross Margin %',type:'KPI',icon:'📍'},
  ];
  const list=document.getElementById('widgetList');
  for(const w of widgets){
    await wait(300);
    list.insertAdjacentHTML('beforeend',`
      <div class="widget-card" data-name="${w.name}">
        <span style="font-size:16px">${w.icon}</span>
        <span class="wg-name">${w.name}</span>
        <span class="wg-type">${w.type}${w.type==='Grid'?'':' · Preview only'}</span>
      </div>
    `);
  }
}

// Scene 2: Select OUTPUT: P&L Statement
async function scene2(){
  await wait(1500);
  const cards=document.querySelectorAll('.widget-card');
  cards[0].classList.add('selected');
  await wait(1500);
  // Show config for selected widget
  const sb=document.getElementById('sidebarContent');
  sb.insertAdjacentHTML('beforeend',`
    <div id="widgetConfig" style="background:rgba(255,69,58,0.03);padding:12px;border-radius:12px;border:1px solid rgba(255,69,58,0.2);animation:slideDown .3s ease">
      <div style="font-size:13px;font-weight:600;color:#1F2937;margin-bottom:8px">OUTPUT: P&L Statement</div>
      <div style="font-size:11px;color:var(--ios-text-secondary);margin-bottom:4px">Source: P&L Summary module</div>
      <div style="font-size:11px;color:var(--ios-text-secondary);margin-bottom:12px">Layout: Hierarchy rows, Time columns</div>
    </div>
  `);
}

// Scene 3: Widget config with Anaplan UX layout preserved
async function scene3(){
  const config=document.getElementById('widgetConfig');
  config.insertAdjacentHTML('beforeend',`
    <div style="background:white;border-radius:8px;border:1px solid #e5e7eb;padding:8px;margin-bottom:12px">
      <div style="font-size:10px;font-weight:600;color:#6B7280;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Board Formatting Detected</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        <span style="font-size:9px;background:#e8f0fe;color:#1a2744;padding:2px 6px;border-radius:4px;font-weight:500">Hierarchy indentation</span>
        <span style="font-size:9px;background:#fef3c7;color:#d97706;padding:2px 6px;border-radius:4px;font-weight:500">Summary bold</span>
        <span style="font-size:9px;background:#d1fae5;color:#059669;padding:2px 6px;border-radius:4px;font-weight:500">Number formats</span>
        <span style="font-size:9px;background:#ede9fe;color:#7c3aed;padding:2px 6px;border-radius:4px;font-weight:500">Header styles</span>
        <span style="font-size:9px;background:#fee2e2;color:#dc2626;padding:2px 6px;border-radius:4px;font-weight:500">Negative (red)</span>
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:6px;margin-bottom:12px">
      <input id="applyBoardFormatting" type="checkbox" checked style="width:16px;height:16px;accent-color:#FF453A">
      <span style="font-size:12px;color:var(--ios-text-primary)">Apply board formatting to sheet</span>
    </label>
    <p id="formattingChoiceNote" role="status" style="font-size:11px;line-height:1.5;color:#51657c">Pause to change this option before the sample is written.</p>
    <button class="btn-primary" id="execWidgetBtn" style="background:linear-gradient(135deg,#FF453A,#FF6961)">Create Pivot</button>
  `);
  document.getElementById('applyBoardFormatting').addEventListener('change',event=>{
    formattingRequested=event.target.checked;
    demoPlayer.pause();
    setFormattingPath(formattingRequested);
    document.getElementById('formattingChoiceNote').textContent=formattingRequested?'Source formatting selected. Press Play to continue.':'Plain output selected. Press Play to continue; the alternative output steps use on-screen notes instead of formatting narration.';
  });
  await wait(2000);
  // Click execute
  document.getElementById('execWidgetBtn').style.transform='scale(0.97)';
  await wait(150);
  document.getElementById('execWidgetBtn').style.transform='';
}

// Scene 4: Execute → data writes to sheet (plain first)
async function scene4(){
  const formattingChoice=document.getElementById('applyBoardFormatting');
  formattingRequested=formattingChoice.checked;
  formattingChoice.disabled=true;
  document.getElementById('execWidgetBtn').disabled=true;
  document.getElementById('execWidgetBtn').textContent='Writing data...';

  // Show progress in sidebar
  const config=document.getElementById('widgetConfig');
  config.insertAdjacentHTML('beforeend',`
    <div style="margin-top:12px" id="execProgress">
      <div style="font-size:12px;font-weight:500;color:#374151;margin-bottom:4px" id="execLabel">Writing data...</div>
      <div class="prog-bar-wrap"><div class="prog-bar" id="execBar"></div></div>
      <div style="font-size:10px;color:#6B7280" id="execDetail">0%</div>
    </div>
  `);

  // Update sheet tab
  document.getElementById('sheetTabs').innerHTML='<div class="sheet-tab">Sheet1</div><div class="sheet-tab active">P&L Statement</div>';

  // Write plain data first (no formatting yet)
  const t=document.getElementById('gridTable');
  const financials=buildUxFinancials();
  const amounts=(key,negative=false)=>financials[key].map(value=>(negative?'(':'')+value.toLocaleString('en-US')+(negative?')':''));
  const rows=[
    {l:'P&L Statement',cls:'',v:['Q1 FY26','Q2 FY26','Q3 FY26','Q4 FY26','FY26']},
    {l:'Revenue',cls:'',v:['','','','','']},
    {l:'SaaS Revenue',cls:'',v:amounts('saas')},
    {l:'  Existing subscriptions',cls:'',v:amounts('existing')},
    {l:'  New subscriptions',cls:'',v:amounts('newSubscriptions')},
    {l:'  Expansion revenue',cls:'',v:amounts('expansion')},
    {l:'Services Revenue',cls:'',v:amounts('services')},
    {l:'Total Revenue',cls:'',v:amounts('revenue')},
    {l:'',cls:'',v:['','','','','']},
    {l:'Cost of Revenue',cls:'',v:['','','','','']},
    {l:'Hosting & Infra',cls:'',v:amounts('hosting',true)},
    {l:'Support Staff',cls:'',v:amounts('support',true)},
    {l:'CS & Onboarding',cls:'',v:amounts('onboarding',true)},
    {l:'Total COGS',cls:'',v:amounts('cogs',true)},
    {l:'',cls:'',v:['','','','','']},
    {l:'Gross Profit',cls:'',v:amounts('grossProfit')},
    {l:'Gross Margin %',cls:'',v:financials.grossMargin.map(value=>value===null?'—':(value*100).toFixed(1)+'%')},
  ];

  let html='<thead><tr><th class="corner"></th>';
  'ABCDEFG'.split('').forEach(l=>{html+=`<th class="col-header">${l}</th>`});
  html+='</tr></thead><tbody id="gridBody">';
  [['','P&L Statement · Sample report'],['','Versions','FY26 Open Forecast'],['']].forEach((values,i)=>{
    html+=`<tr><td class="row-header">${i+1}</td>${Array.from({length:7},(_,c)=>`<td>${values[c]||''}</td>`).join('')}</tr>`;
  });
  html+='</tbody>';
  t.innerHTML=html;
  const body=document.getElementById('gridBody');

  for(let i=0;i<rows.length;i++){
    await wait(150);
    const r=rows[i];
    let tr=`<tr id="row${i}"><td class="row-header">${i+4}</td><td class="sheet-gutter"></td><td>${r.l}</td>`;
    r.v.forEach(v=>{tr+=`<td class="${v.startsWith('(')?'num neg':'num'}">${v}</td>`});
    tr+='</tr>';body.insertAdjacentHTML('beforeend',tr);

    const pct=Math.round(((i+1)/rows.length)*60);
    document.getElementById('execBar').style.width=pct+'%';
    document.getElementById('execDetail').textContent=pct+'% — Writing cells';
  }
  document.getElementById('execLabel').textContent=formattingRequested?'Data written, applying formatting...':'Data written without source formatting';
}

// Scene 5: Formatting applies with visual transformation
async function scene5(){
  if(!formattingRequested){
    document.getElementById('execBar').style.width='100%';
    document.getElementById('execBar').classList.add('complete');
    document.getElementById('execLabel').textContent='✓ Plain sample output ready';
    document.getElementById('execDetail').textContent='100% — Source formatting skipped by your selection';
    return;
  }
  const rowStyles=['ux-h0','ux-h1','ux-h2','ux-detail','ux-detail','ux-detail','ux-h2','ux-subtotal','','ux-h1','ux-detail','ux-detail','ux-detail','ux-subtotal','','ux-total','ux-pct'];
  for(let row=0;row<rowStyles.length;row++){
    await wait(280);
    const style=rowStyles[row];
    if(!style)continue;
    // Never format the sheet's row-number chrome or reserved column A.
    const cells=document.getElementById('row'+row).querySelectorAll('td:not(.row-header):not(.sheet-gutter)');
    cells[0].className=style;
    cells.forEach((cell,index)=>{
      if(index===0)return;
      const band=['ux-h0','ux-h1','ux-subtotal','ux-total','ux-pct'].includes(style)?style+' ':'';
      cell.className=band+'num'+(cell.textContent.startsWith('(')?' neg':'');
    });
    const pct=60+Math.round((row+1)/rowStyles.length*40);
    document.getElementById('execBar').style.width=pct+'%';
    document.getElementById('execDetail').textContent=pct+'% — Applying supported sample styles';
  }

  document.getElementById('execBar').style.width='100%';
  document.getElementById('execBar').classList.add('complete');
  document.getElementById('execLabel').textContent='✓ Formatting applied!';
  document.getElementById('execLabel').style.color='#059669';
  document.getElementById('execDetail').textContent='100% — Complete';
}

// Scene 6: Show the final result
async function scene6(){
  await wait(800);
  document.getElementById('execWidgetBtn').textContent='✓ Import Complete';
  document.getElementById('execWidgetBtn').style.background='linear-gradient(135deg,#30D158,#34C759)';
  document.getElementById('execWidgetBtn').disabled=false;

  document.getElementById('cellRef').textContent='B19';
  document.getElementById('formulaText').textContent='Gross Profit';

  // Add a note in sidebar
  const config=document.getElementById('widgetConfig');
  config.insertAdjacentHTML('beforeend',`
    <div style="background:#f0fdf4;border-radius:8px;padding:10px;margin-top:12px;font-size:11px;color:#059669;font-weight:500;animation:slideDown .3s ease">
      ${formattingRequested?`✓ Supported sample styles preserved:<br>
      • Hierarchy indentation (3 levels)<br>
      • Bold summaries & subtotals<br>
      • Number formats with commas<br>
      • Red negatives for costs<br>
      • Section headers with backgrounds`:'✓ Plain sample output · Source formatting was not applied.'}<br><br>
      USD · recognized revenue. FY26 amounts sum the four quarters; annual gross margin is annual gross profit ÷ annual revenue, not a sum of percentages.
    </div>
  `);
}

demoPlayer = new DemoPlayer({scenes:SCENES, actions:[scene1,scene2,scene3,scene4,scene5,scene6], reset:()=>{resetDemo();initGrid();}});
// Keep the recorded default path unchanged. A manual plain-output branch uses
// accurate notes instead of playing clips that claim formatting was applied.
const formattingNarration=[4,5].map(index=>({index,clip:demoPlayer.clips?.[index],caption:demoPlayer.captions?.[index],name:SCENES[index].name}));
if(demoPlayer.captions)demoPlayer.captions=[...demoPlayer.captions];
function setFormattingPath(enabled){
  for(const track of formattingNarration){
    if(demoPlayer.clips){if(enabled)demoPlayer.clips[track.index]=track.clip;else delete demoPlayer.clips[track.index];}
    if(demoPlayer.captions)demoPlayer.captions[track.index]=enabled?track.caption:track.index===4?'You chose plain sample output. Source UX formatting is skipped; the same selected data is retained.':'Review the plain sample output. Restart the walkthrough to compare it with the default source-formatted result.';
    SCENES[track.index].name=enabled?track.name:track.index===4?'Skip Source Formatting':'Final Plain P&L';
  }
}
demoPlayer.mount();
</script>
